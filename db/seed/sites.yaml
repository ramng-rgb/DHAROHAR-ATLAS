demo_route:
  slug: gujarat-stepwell-trail
  title: 'Explorer Fellowship: Gujarat Stepwell Trail'
  summary: A curated 6-stop historical fellowship tracing medieval hydraulic sanctification
    from the Saraswati river sands of Patan through Sultanate Ahmedabad to the Aravalli
    foothills.
  stops:
  - site_slug: rani-ki-vav
    stop_order: 1
    arrival_note: 'Commence expedition at dawn at Rani ki Vav. Note: Descriptive travel
      narrative is an illustrative sample designed for historical fellowship visualization.'
  - site_slug: modhera-sun-temple
    stop_order: 2
    arrival_note: Arrive at Modhera Sun Temple for mid-day equinox shadow measurement
      along Surya Kund stepped pavilions.
  - site_slug: adalaj-vav
    stop_order: 3
    arrival_note: Descend into Adalaj Vav's cooling five subterranean storeys, examining
