sites:
- slug: rani-ki-vav
  name: Rani ki Vav (The Queen's Stepwell)
  name_hi: रानी की वाव
  name_gu: રાણી ની વાવ
  summary: An intricately constructed 7-level subterranean stepwell situated on the
    banks of Saraswati River in Patan, built by Queen Udayamati in memory of Chaulukya
    King Bhima I. Celebrated as the zenith of Maru-Gurjara hydraulic architecture
    with over 800 sculptures.
  site_type: stepwell
  state: Gujarat
  district: Patan
  latitude: 23.8589
  longitude: 72.1017
  period_start_year: 1063
  period_end_year: 1083
  era_label: Solanki Period
  dynasty: Solanki (Chaulukya)
  data_confidence: verified
  source_text: Archaeological Survey of India Monument Dossier; UNESCO World Heritage
    Citation WHC-14/38.COM/8B
  source_url: https://whc.unesco.org/en/list/1301/
  architectural_style: Maru-Gurjara Subterranean
  tags:
  - unesco_world_heritage
  - hydraulic_engineering
  - solanki
  - vishnu_dashavatara
  - subterranean
  media:
  - url: https://images.unsplash.com/photo-1599661046827-dacff0c0f09a?auto=format&fit=crop&w=1200&q=80
    caption: Subterranean tiers and carved pavilions descending to Saraswati groundwater
      level
    license: Unsplash / CC-BY Compatible
    attribution: Dharohar Field Photography Collection
    source_url: https://unsplash.com/photos/stepwell-monument
  model_3d:
