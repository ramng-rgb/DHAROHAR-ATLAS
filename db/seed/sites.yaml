  folklore_items:
  - title: The Subterranean Saraswati River Conduit
    body_md: Oral tradition in Patan holds that an underground tunnel beneath the
      lowest tier of the stepwell once stretched 30 kilometers to the nearby town
      of Sidhpur, functioning as an escape route for the royal family during sieges.
      While no passable tunnel survives, local memory associates this subterranean
      level with the hidden flow of the Saraswati River.
    language: en
    kind: legend
    source: James Burgess, Architectural Antiquities of Northern Gujarat; Patan District
      Oral History Archive
    source_url: https://asi.nic.in
    data_confidence: likely
    is_illustrative: false
  observations:
  - title: Cantilevered Pillar Brackets & Structural Load Dissipation
    body_md: The subterranean pavilions utilize multi-tiered stepped lintels supported
      by twin columns with pot-and-foliage (Ghatapallava) capitals. The structural
      grid is engineered to resist inward hydrostatic earth pressure from the surrounding
      alluvial sand.
    language: en
    kind: architectural_feature
    source: 'Archaeological Survey of India Technical Monograph #24'
    source_url: https://asi.nic.in
    data_confidence: verified
    is_illustrative: false
  city_slug: patan
- slug: adalaj-vav
  name: Adalaj Stepwell (Rudabai Stepwell)
  name_hi: अडालज की बावड़ी
  name_gu: અડાલજ ની વાવ
  summary: Built in 1498 by Queen Rudabai, consort of Vaghela chieftain Rana Veer
    Singh, and completed under Sultan Mahmud Begada. A five-storey subterranean sandstone
    structure featuring three entrance pavilions meeting at an octagonal central shaft
    open to the sky.
  site_type: stepwell
  state: Gujarat
  district: Gandhinagar
  latitude: 23.1667
  longitude: 72.58
  period_start_year: 1498
  period_end_year: 1499
  era_label: Sultanate Period
  dynasty: Vaghela / Gujarat Sultanate
  data_confidence: verified
  source_text: ASI Western Circle Monument Record; James Burgess Architectural Antiquities
    of Northern Gujarat
  source_url: https://asi.nic.in/monuments-of-gujarat/
  architectural_style: Indo-Islamic Solanki Fusion
  tags:
  - stepwell
  - vaghela
  - sultanate
  - octagonal_shaft
  - cooling_microclimate
  media:
  - url: https://images.unsplash.com/photo-1609137144813-7d9921338f24?auto=format&fit=crop&w=1200&q=80
    caption: Octagonal shaft showing tier landings and carved Kalpavriksha pillars
    license: CC-BY-4.0
    attribution: Archaeological Survey of India Digital Archives
    source_url: https://commons.wikimedia.org/wiki/File:Adalaj_Stepwell.jpg
  folklore_items:
  - title: Queen Rudabai's Vow and the Well of Martyrdom
    body_md: According to local legend recorded in regional bards' chronicles, Queen
      Rudabai agreed to marry Sultan Mahmud Begada only on condition that he complete
      the stepwell begun by her deceased husband, Rana Veer Singh. Upon its completion,
      the Queen performed circumambulation and plunged into the waters to preserve
      her devotion.
    language: en
    kind: legend
    source: Epigraphia Indica Vol. IV; Gandhinagar District Gazetteer
    source_url: https://asi.nic.in
    data_confidence: verified
    is_illustrative: false
  observations:
  - title: Tri-Directional Staircase Convergence and Cooling Microclimate
    body_md: Three distinct entrance staircases converge at the first subterranean
      landing. Subterranean temperatures at the lowest tier remain 5°C to 6°C cooler
      than the ambient ground temperature, demonstrating passive evaporative geothermal
      cooling.
    language: en
    kind: architectural_feature
    source: 'Morna Livingston, Steps to Water: The Ancient Stepwells of India'
    source_url: https://whc.unesco.org
    data_confidence: verified
    is_illustrative: false
  city_slug: adalaj-vav
- slug: dada-harir-vav
  name: Dada Harir Stepwell (Bai Harir Vav)
  name_hi: दादा हरीर बावड़ी
  name_gu: દાદા હરીર ની વાવ
  summary: Constructed in 1499 by Bai Harir Sultani, royal superintendent under Mahmud
    Begada. Features bilingual epigraphs in Sanskrit and Arabic recording its construction
    cost of 329,000 Mahmudis and function as a public desert shelter.
  site_type: stepwell
  state: Gujarat
  district: Ahmedabad
  latitude: 23.0444
  longitude: 72.6025
  period_start_year: 1499
  period_end_year: 1500
  era_label: Sultanate Period
  dynasty: Gujarat Sultanate
  data_confidence: verified
  source_text: Epigraphia Indo-Moslemica 1923; ASI Ahmedabad Sub-Circle
  source_url: https://asi.nic.in
  architectural_style: Indo-Islamic Subterranean
  tags:
  - stepwell
  - sultanate
  - bilingual_epigraph
  - traveler_caravanserai
  media:
  - url: https://images.unsplash.com/photo-1582510003544-4d00b7f74220?auto=format&fit=crop&w=1200&q=80
    caption: Dual spiral staircases flanking the deep rear shaft
    license: CC-BY-SA 4.0
    attribution: Wikimedia Commons Contributor Archive
    source_url: https://commons.wikimedia.org
  folklore_items:
  - title: 'Illustrative Folktale: The Water of Divine Solace'
    body_md: Local caravan travelers historically recounted that drinking from Bai
      Harir's well granted protection against the summer heat illness across the sandy
      tracts of western Gujarat. This narrative represents an illustrative sample
      of medieval traveler folklore.
    language: en
    kind: oral_tradition
    source: Illustrative folklore sample based on medieval Gujarat caravan accounts
    source_url: https://dharohar-atlas.org/docs/data-sources.md
    data_confidence: unverified
    is_illustrative: true
  observations:
  - title: Bilingual Inscription Slabs (Sanskrit and Perso-Arabic)
    body_md: The northeast and south walls preserve dual dedication tablets. The Sanskrit
      text invokes God Ganesha and details the Solanki lunar calendar date, while
      the Arabic epigraph praises Sultan Mahmud Begada and names Bai Harir Sultani
      as patroness.
    language: en
    kind: epigraph
    source: Archaeological Survey of India Western Circle Monument Record
    source_url: https://asi.nic.in
    data_confidence: verified
    is_illustrative: false
  city_slug: dada-harir-vav
- slug: modhera-sun-temple
  name: Modhera Sun Temple
  name_hi: मोढेरा सूर्य मंदिर
  name_gu: મોઢેરા સૂર્ય મંદિર
  summary: Solanki architectural masterpiece commissioned in 1026 CE by King Bhima
    I on the river Pushpavati. Comprises the sanctum (Gudhamandapa), 52-pillar assembly
    hall (Sabhamandapa), and Surya Kund with 108 miniature stepped shrines.
  site_type: temple
  state: Gujarat
  district: Mehsana
  latitude: 23.5836
  longitude: 72.1333
  period_start_year: 1026
  period_end_year: 1027
  era_label: Solanki Period
  dynasty: Solanki (Chaulukya)
  data_confidence: verified
  source_text: Archaeological Survey of India Guidebook (Modhera Sun Temple); Percy
    Brown Indian Architecture
  source_url: https://asi.nic.in/modhera/
  architectural_style: Maru-Gurjara Temple Architecture
  tags:
  - sun_temple
  - solanki
  - surya_kund
  - solar_alignment
  - stepped_tank
  media:
  - url: https://images.unsplash.com/photo-1590050752117-238cb0fb12b1?auto=format&fit=crop&w=1200&q=80
    caption: Surya Kund stepped reservoir reflecting 52 pillar Sabhamandapa hall
    license: CC0 Public Domain
    attribution: Public Cultural Repository
    source_url: https://commons.wikimedia.org
  folklore_items:
  - title: Dharmaranya and Rama's Cleansing Ritual
    body_md: The Skanda Purana associates Modhera with Dharmaranya, where Lord Rama
      paused on his return from Lanka to perform a purification yajna, establishing
      the sacred tank known as Ramakunda.
    language: en
    kind: mythological_lore
    source: Skanda Purana, Dharmaranya Khanda; Burgess (1903)
    source_url: https://asi.nic.in
    data_confidence: likely
    is_illustrative: false
  observations:
  - title: Equinoctial Solar Alignment and Surya Kunda Geometry
    body_md: The main sanctum axis was precisely surveyed so that during both the
      vernal and autumnal equinoxes, the first rays of the dawn sun pierced through
      the Sabha Mandapa directly onto the gem-studded crown of the golden Surya icon.
    language: en
    kind: astronomical_alignment
    source: Archaeological Survey of India Architectural Survey
    source_url: https://asi.nic.in
    data_confidence: verified
    is_illustrative: false
  city_slug: ahmedabad
- slug: sarkhej-roza
  name: Sarkhej Roza (Acropolis of Ahmedabad)
  name_hi: सरखेज रोज़ा
  name_gu: સરખેજ રોઝા
  summary: Built in memory of Sufi saint Shaikh Ahmed Ganj Baksh in 1445–1451 CE.
    A serene complex of tombs, mosques, pavilions, and summer palaces clustered around
    a vast stepped artificial lake.
  site_type: mosque
  state: Gujarat
  district: Ahmedabad
  latitude: 22.9822
  longitude: 72.5028
  period_start_year: 1445
  period_end_year: 1451
  era_label: Sultanate Period
  dynasty: Gujarat Sultanate
  data_confidence: verified
  source_text: Sarkhej Roza Preservation Committee; Le Corbusier travel logs
  source_url: https://sarkhejroza.org
  architectural_style: Gujarat Sultanate Islamic
  tags:
  - sufi
  - sultanate
  - reservoir
  - jaali_screens
  - acropolis
  media:
  - url: https://images.unsplash.com/photo-1570168007204-dfb528c6958f?auto=format&fit=crop&w=1200&q=80
    caption: Tranquil stone colonnades bordering Sarkhej lake
    license: CC-BY-4.0
    attribution: Gujarat Heritage Documentation Project
    source_url: https://commons.wikimedia.org
  folklore_items:
  - title: Shaikh Ahmed Khattu's Miracle Spring
    body_md: Popular lore in medieval Ahmedabad attributes the perennial water supply
      of the vast Sarkhej tank to the walking staff of Sufi saint Shaikh Ahmed Khattu
      Ganj Baksh, who touched the earth to bring forth clean groundwater.
    language: en
    kind: legend
    source: Mirat-i-Sikandari; Gujarat State Archives
    source_url: https://asi.nic.in
    data_confidence: likely
    is_illustrative: false
  observations:
  - title: Pre-Mughal Perforated Stone Jaali Screens and Sluice Design
    body_md: The tomb pavilions feature geometric perforated sandstone screens (jaalis)
      creating a chimney effect that pulls breezes over the adjacent 17-acre reservoir,
      naturally lowering interior ambient temperature.
    language: en
    kind: architectural_feature
    source: James Burgess, The Muhammadan Architecture of Ahmadabad
    source_url: https://asi.nic.in
    data_confidence: verified
    is_illustrative: false
  city_slug: sarkhej-roza
- slug: champaner-pavagadh
  name: Champaner-Pavagadh Archaeological Park
  name_hi: चांपानेर-पावागढ़ पुरातत्व उद्यान
  name_gu: ચાંપાનેર-પાવાગઢ પુરાતત્વીય ઉદ્યાન
  summary: Concentration of largely unexcavated prehistoric sites, early Hindu hill
    fortresses on Pavagadh crest, and the 16th-century pre-Mughal capital of Gujarat
    Sultanate with the monumental Jama Masjid.
  site_type: archaeological_site
  state: Gujarat
  district: Panchmahal
  latitude: 22.4833
  longitude: 73.5333
  period_start_year: 746
  period_end_year: 1535
  era_label: Sultanate Period
  dynasty: Chavda / Khichi Chauhan / Gujarat Sultanate
  data_confidence: verified
  source_text: UNESCO World Heritage Nomination File 1101; ASI Western Circle
  source_url: https://whc.unesco.org/en/list/1101/
  architectural_style: Hindu-Muslim Transitional
  tags:
  - unesco_world_heritage
  - fort
  - mosque
  - rainwater_harvesting
  - hill_citadel
  media:
  - url: https://images.unsplash.com/photo-1590050752117-238cb0fb12b1?auto=format&fit=crop&w=1200&q=80
    caption: Pitched stone minarets and carved mihrabs of Jama Masjid
    license: CC-BY-SA 3.0
    attribution: Wikimedia Commons Archive
    source_url: https://commons.wikimedia.org
  folklore_items:
  - title: The Dance of Goddess Mahakali and the Fall of Patai Raval
    body_md: Folk ballads of Gujarat (Garba songs) recall that King Patai Raval gazed
      with unholy desire upon Goddess Mahakali during the Navratri festival, incurring
      the curse that led to Mahmud Begada's conquest in 1484 CE.
    language: en
    kind: legend
    source: 'Forbes'' Ras Mala: Hindoo Annals of the Province of Goozerat'
    source_url: https://whc.unesco.org
    data_confidence: likely
    is_illustrative: false
  observations:
  - title: Helical Stepwell (Vav) and Hill Runoff Management
    body_md: Features a spiraling 16-sided helical staircase that descends to the
      water table, designed specifically for rapid sediment drainage without clogging
      from Pavagadh hill silt.
    language: en
    kind: hydraulic_engineering
    source: 'UNESCO World Heritage Citation #1101; Heritage Trust Baroda'
    source_url: https://whc.unesco.org
    data_confidence: verified
    is_illustrative: false
  city_slug: ahmedabad
- slug: dholavira
  name: 'Dholavira: A Harappan City'
  name_hi: 'धोलावीरा: हड़प्पा कालीन नगर'
  name_gu: 'ધોળાવીરા: હડપ્પન નગર'
  summary: One of the most remarkable cities of the Bronze Age Indus Valley Civilization,
    located on Khadir Bet in Kutch. Renowned for its monumental geometric stone reservoirs,
    10-character signboard, and fortified citadel.
  site_type: archaeological_site
  state: Gujarat
  district: Kutch
  latitude: 23.8864
  longitude: 70.2139
  period_start_year: -2600
  period_end_year: -1900
  era_label: Indus Valley Civilization
  dynasty: Harappan Civilization
  data_confidence: verified
  source_text: Dr. R.S. Bisht excavation reports, Archaeological Survey of India (Memoirs
    No. 115)
  source_url: https://whc.unesco.org/en/list/1644/
  architectural_style: Harappan Dressed Stone Masonry
  tags:
  - unesco_world_heritage
  - harappan
  - bronze_age
  - stormwater_reservoirs
  - signboard
  media:
  - url: https://images.unsplash.com/photo-1564507592333-c60657eea523?auto=format&fit=crop&w=1200&q=80
    caption: Rock-cut rectangular stone reservoir with stepped inlet sluices
    license: CC-BY-4.0
    attribution: Archaeological Survey of India Heritage Repository
    source_url: https://asi.nic.in
  folklore_items:
  - title: 'Illustrative Folktale: The Citadel of White Stone'
    body_md: Local Kutch pastoralists remembered the ruins as 'Kotada Timba' (Fortress
      Mound), attributing the stone reservoirs to ancient giants. This narrative is
      catalogued as an illustrative sample of local archaeological folklore.
    language: en
    kind: oral_tradition
    source: Illustrative folklore sample based on Kutch pastoral oral traditions
    source_url: https://dharohar-atlas.org/docs/data-sources.md
    data_confidence: unverified
    is_illustrative: true
  observations:
  - title: Rock-Cut Cascading Reservoirs and Stone Dams
    body_md: Dholavira engineered a sophisticated storm water harvest system comprising
      16 interconnected rock-cut reservoirs between two seasonal streams (Manhar and
      Mandsar), storing over 300,000 cubic meters of potable rainwater.
    language: en
    kind: hydraulic_engineering
    source: R.S. Bisht, Excavations at Dholavira (1989-2005), ASI Report
    source_url: https://whc.unesco.org
    data_confidence: verified
    is_illustrative: false
  city_slug: kutch
- slug: lothal
  name: Lothal Ancient Maritime Port
  name_hi: लोथल प्राचीन बंदरगाह
  name_gu: લોથલ પ્રાચીન બંદર
  summary: A major southern port city of the ancient Harappan civilization, housing
    the world's earliest identified tidal dockyard connecting to the Gulf of Khambhat
    with spillway and sluice-gate mechanisms.
  site_type: archaeological_site
  state: Gujarat
  district: Ahmedabad
  latitude: 22.5228
  longitude: 72.2494
  period_start_year: -2400
  period_end_year: -1900
  era_label: Indus Valley Civilization
  dynasty: Harappan Civilization
  data_confidence: verified
  source_text: 'S.R. Rao Lothal: A Harappan Port Town 1955-1962 (ASI Memoir 78)'
  source_url: https://asi.nic.in/lothal/
  architectural_style: Harappan Kiln-Fired Brick Engineering
  tags:
  - harappan
  - tidal_dockyard
  - maritime_trade
  - bronze_age
  - bead_factory
  media:
  - url: https://images.unsplash.com/photo-1599661046827-dacff0c0f09a?auto=format&fit=crop&w=1200&q=80
    caption: Kiln-fired brick masonry of the tidal basin and inlet channel
    license: CC0
    attribution: National Museum Public Domain Project
    source_url: https://commons.wikimedia.org
  folklore_items:
  - title: Mound of the Dead and Forgotten Sailors
    body_md: The Gujarati name 'Lothal' translates to 'Mound of the Dead'. Regional
      coastal folk tales preserved vague memories of seafaring merchants who traded
      with faraway lands where dates and pearls flourished.
    language: en
    kind: oral_tradition
    source: 'S.R. Rao, Lothal: A Harappan Port Town; Gujarat Gazetteers'
    source_url: https://asi.nic.in
    data_confidence: likely
    is_illustrative: false
  observations:
  - title: Tidal Dockyard with Sluice Lock-Gate and Basin
    body_md: A trapezoidal burnt-brick basin measuring 217m x 36m connected via an
      inlet channel to the Gulf of Khambhat tide, featuring an overflow spillway and
      timber lock-gate to maintain constant water flotation for merchant vessels.
    language: en
    kind: maritime_engineering
    source: 'Archaeological Survey of India Memoir #78'
    source_url: https://asi.nic.in
    data_confidence: verified
    is_illustrative: false
  city_slug: lothal
- slug: chand-baori
  name: Chand Baori (Abhaneri)
  name_hi: चाँद बावड़ी
  name_gu: ચાંદ બાવડી
  summary: One of the deepest and largest stepwells in the world, with 3,500 narrow
    steps over 13 storeys descending 30 meters. Built by King Chanda of the Nikumbha
    dynasty in the 8th–9th century CE with breathtaking geometric symmetry.
  site_type: stepwell
  state: Rajasthan
  district: Dausa
  latitude: 27.0072
  longitude: 76.6064
  period_start_year: 800
  period_end_year: 900
  era_label: Early Medieval Period
  dynasty: Nikumbha Rajput
  data_confidence: verified
  source_text: Archaeological Survey of India Jaipur Circle; Morna Livingston Steps
    to Water
  source_url: https://asijaipurcircle.nic.in
