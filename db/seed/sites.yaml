    status: ready
    hotspots:
    - label: Ground Entrance & First Terrace
      label_hi: धरातल प्रवेश एवं प्रथम सोपान
      label_gu: જમીન પ્રવેશ અને પ્રથમ સ્તર
      body_md: The stepped corridor begins at ground level facing west towards Saraswati
        riverbed, descending via four stepped pavilions.
      position:
      - 0.0
