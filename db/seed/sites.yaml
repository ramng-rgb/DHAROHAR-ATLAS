- slug: rajasthan-forts-trail
  title: 'Citadels of the Desert: Marwar & Mewar Fortresses Trail'
  title_hi: 'मरुभूमि के दुर्ग: मारवाड़ एवं मेवाड़ किला यात्रा'
  title_gu: 'રણના કિલ્લાઓ: મારવાડ અને મેવાડ કિલ્લા યાત્રા'
  summary: A 4-stop architectural voyage across Rajasthan's cliff-top fortifications,
    from Chittorgarh's victory towers to Chand Baori's geometric labyrinth.
  summary_hi: चित्तौड़गढ़ के विजय स्तंभ से लेकर चाँद बावड़ी के ज्यामितीय भूलभुलैया
    तक राजस्थान के पहाड़ी दुर्गों की 4-पड़ाव की यात्रा।
  summary_gu: ચિત્તોડગઢના વિજય સ્તંભથી લઈને ચાંદ બાવડીની ભૌમિતિક ભુલભુલામણી સુધી રાજસ્થાનના
    પહાડી કિલ્લાઓની 4-પડાવની યાત્રા.
  difficulty: Challenging
  era_theme: Rajput Military Architecture & Bastions
  total_distance_km: 390.0
  estimated_duration_days: 3
  stops:
  - site_slug: chittorgarh-fort
    stop_order: 1
    arrival_note: Ascend the legendary 180-meter plateau of Chittorgarh. Inspect the
      9-storey Vijay Stambha and water-storing Gaumukh Kund reservoir.
    arrival_note_source: ASI Jaipur Circle Survey Notes; Tod Annals of Rajasthan
    is_illustrative: false
    dwell_seconds: 14
  - site_slug: kumbhalgarh-fort
    stop_order: 2
    arrival_note: Traverse into the rugged Aravalli crest. Walk along the 36-kilometer
      continuous defensive stone perimeter wall built by Rana Kumbha.
    arrival_note_source: 'Archaeological Survey of India Technical Monograph #31'
    is_illustrative: false
    dwell_seconds: 14
  - site_slug: mehrangarh-fort
    stop_order: 3
    arrival_note: Stand before the 120-meter volcanic perpendicular cliff of Jodhpur.
      Examine Rao Jodha's massive bastions and delicate red sandstone jharokhas.
    arrival_note_source: Mehrangarh Museum Trust Archival Records
    is_illustrative: false
    dwell_seconds: 14
  - site_slug: chand-baori
    stop_order: 4
    arrival_note: 'Conclude at the geometric wonder of Abhaneri: 3,500 triangular
      steps cascading 13 subterranean storeys into an emerald pool.'
    arrival_note_source: Dausa District Gazetteer; Morna Livingston (2002)
    is_illustrative: false
    dwell_seconds: 16
