demo_route:
  slug: gujarat-stepwell-trail
  title: Gujarat Stepwell & Water Architecture Trail
  title_hi: गुजरात वाव एवं जल स्थापत्य यात्रा
  title_gu: ગુજરાત વાવ અને જળ સ્થાપત્ય યાત્રા
  summary: An 8-stop flagship expedition tracing 4,500 years of water architecture
    from Bronze Age Harappan reservoirs to grand medieval subterranean stepwells.
  summary_hi: कांस्य युगीन हड़प्पा जलाशयों से लेकर भव्य मध्यकालीन बावड़ियों तक जल
    स्थापत्य के 4,500 वर्षों का 8-पड़ाव वाला ऐतिहासिक मार्ग।
  summary_gu: કાંસ્ય યુગના હડપ્પન જળાશયોથી લઈને ભવ્ય મધ્યયુગીન વાવો સુધીના જળ સ્થાપત્યના
    4,500 વર્ષોને જોડતી 8-પડાવની મુખ્ય યાત્રા.
  difficulty: Moderate
  era_theme: Subterranean Hydraulic Sanctification
  total_distance_km: 485.0
  estimated_duration_days: 4
  stops:
  - site_slug: adalaj-vav
    stop_order: 1
    arrival_note: Begin at Adalaj Stepwell at dawn. Five subterranean storeys descend
      into cool sandstone pavilions built by Queen Rudabai in 1499 CE.
    arrival_note_source: ASI Western Circle Epigraphy Monograph; Gazetteer of Bombay
      Presidency Vol IX
    is_illustrative: false
    dwell_seconds: 14
  - site_slug: dada-harir-vav
    stop_order: 2
    arrival_note: Continue southeast into Asarwa, Ahmedabad. Inspect the bilingual
      Sanskrit and Arabic foundation epigraphs on the spiral staircase landings.
    arrival_note_source: James Burgess, Architectural Antiquities of Northern Gujarat
      (1903)
    is_illustrative: false
    dwell_seconds: 12
  - site_slug: sarkhej-roza
    stop_order: 3
    arrival_note: Reach the royal lakeside acropolis of Sarkhej. Observe sunset water
      reflections across the vast 17-acre stepped masonry tank.
    arrival_note_source: 'Archaeological Survey of India Technical Monograph #19'
    is_illustrative: false
    dwell_seconds: 12
  - site_slug: modhera-sun-temple
    stop_order: 4
    arrival_note: Journey northward to the Pushpavati riverbank for mid-day equinox
      observations along the 52 miniature shrines of Surya Kund.
    arrival_note_source: ASI Northern Circle Survey Report (1922)
    is_illustrative: false
    dwell_seconds: 14
  - site_slug: rani-ki-vav
    stop_order: 5
    arrival_note: 'Descend into the pinnacle of Solanki subterranean architecture:
      seven tiers of sculptured pavilions commissioned by Queen Udayamati in 1063
      CE.'
    arrival_note_source: 'ASI Monument Monograph #24; UNESCO World Heritage Evaluation
      #922'
    is_illustrative: false
    dwell_seconds: 16
  - site_slug: champaner-pavagadh
    stop_order: 6
    arrival_note: Traverse southeast toward Pavagadh hill. Survey the Vada Talav and
      fortified rain-fed masonry cisterns of the medieval Gujarat Sultanate capital.
    arrival_note_source: 'Archaeological Survey of India Memoir #63'
    is_illustrative: false
    dwell_seconds: 12
  - site_slug: lothal
    stop_order: 7
    arrival_note: Arrive at the Gulf of Khambhat floodplains to inspect the world's
      oldest tidal dockyard (2400 BCE), engineered with kiln-fired burnt brick lock-gates.
    arrival_note_source: 'S.R. Rao, Lothal: A Harappan Port Town (ASI Memoir #78)'
    is_illustrative: false
    dwell_seconds: 14
  - site_slug: dholavira
    stop_order: 8
    arrival_note: Conclude in the Great Rann of Kutch amidst massive stone-cut rock
      reservoirs and stormwater catchment conduits of the Indus civilization.
    arrival_note_source: R.S. Bisht, Excavations at Dholavira 1990–2005 (ASI Publication)
    is_illustrative: false
    dwell_seconds: 16
