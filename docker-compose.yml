version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dharohar-db
    environment:
      POSTGRES_USER: ramnarayangupta
      POSTGRES_DB: dharohar_atlas
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ramnarayangupta -d dharohar_atlas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dharohar-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: dharohar-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ramnarayangupta@db:5432/dharohar_atlas
      SYNC_DATABASE_URL: postgresql://ramnarayangupta@db:5432/dharohar_atlas
      REDIS_URL: redis://redis:6379/0

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: dharohar-web
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

volumes:
  postgres_data:
